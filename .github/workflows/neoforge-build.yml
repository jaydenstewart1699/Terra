name: Build Terra NeoForge 1.21.1

on:
  workflow_dispatch:
  push:
    branches:
      - neoforge-1.21.1
  pull_request:
    branches:
      - master

jobs:
  build-neoforge:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge JAR
        run: ./gradlew :platforms:neoforge:build --stacktrace

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: terra-neoforge-1.21.1
          if-no-files-found: error
          path: |
            platforms/neoforge/build/libs/Terra-neoforge-*.jar
            !platforms/neoforge/build/libs/*-sources.jar
            !platforms/neoforge/build/libs/*-javadoc.jar
            !platforms/neoforge/build/libs/*-dev.jar
            !platforms/neoforge/build/libs/*-shadow.jar
