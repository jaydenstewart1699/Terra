name: Build Terra NeoForge 1.21.1

on:
  workflow_dispatch:
  push:
    branches:
      - neoforge-1.21.1
  pull_request:
    branches:
      - master

jobs:
  build-neoforge:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge JAR
        run: ./gradlew :platforms:neoforge:build -Pterra.targetPlatform=neoforge --stacktrace

      - name: Smoke test NeoForge dedicated server
        shell: bash
        run: |
          set -uo pipefail
          run_dir="platforms/neoforge/run"
          log_file="$run_dir/terra-neoforge-smoke.log"
          mkdir -p "$run_dir"
          printf 'eula=true\n' > "$run_dir/eula.txt"

          ./gradlew :platforms:neoforge:runServer \
            -Pterra.targetPlatform=neoforge \
            --args='nogui' > "$log_file" 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in {1..180}; do
            if grep -Fq 'Done (' "$log_file"; then
              tail -n 120 "$log_file"
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              wait "$server_pid"
              status=$?
              cat "$log_file"
              if [ "$status" -eq 0 ]; then
                echo 'NeoForge server exited before reporting a successful start.' >&2
                exit 1
              fi
              exit "$status"
            fi
            sleep 1
          done

          cat "$log_file"
          echo 'NeoForge server did not finish starting within 180 seconds.' >&2
          exit 1

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: terra-neoforge-1.21.1
          if-no-files-found: error
          path: |
            platforms/neoforge/build/libs/Terra-neoforge-*.jar
            !platforms/neoforge/build/libs/*-sources.jar
            !platforms/neoforge/build/libs/*-javadoc.jar
            !platforms/neoforge/build/libs/*-dev.jar
            !platforms/neoforge/build/libs/*-shadow.jar
